name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj zależności projektu
        run: npm ci

      - name: Zainstaluj Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation

      - name: Zbuduj aplikację webową
        run: npm run build

      - name: Utwórz projekt Android
        run: npx cap add android

      - name: Synchronizuj Capacitor
        run: npx cap sync android

      - name: Zbuduj APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Weather-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
