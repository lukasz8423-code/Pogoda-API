name: Deploy AuraPogoda Lab

on:
  push:
    branches: ["aura-lab"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy AuraPogoda Lab
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: aura-lab-pages