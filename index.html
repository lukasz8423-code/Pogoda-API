<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" id="pwa-manifest" />
    <script>
      // Instantly disable PWA features if running inside native app (Capacitor/Android APK)
      (function() {
        var isNative = window.Capacitor && window.Capacitor.isNativePlatform();
        if (isNative || window.location.search.indexOf('platform=android') !== -1) {
          var manifest = document.getElementById('pwa-manifest');
          if (manifest) manifest.parentNode.removeChild(manifest);
          console.log("PWA manifest removed for native platform");
        }
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Aura Pogoda</title>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="background: #020617; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-family: sans-serif; flex-direction: column; gap: 20px;">
        <div style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: aura-spin 1s linear infinite;"></div>
        <style>@keyframes aura-spin { to { transform: rotate(360deg); } }</style>
        <span style="font-size: 14px; letter-spacing: 1px; font-weight: 500;">Aura Pogoda się wczytuje...</span>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var preloader = document.getElementById('app-preloader');
        if (preloader && preloader.parentNode) {
          preloader.innerHTML = '<p style="margin-bottom: 20px;">Aplikacja ładuje się dłużej niż zwykle.</p>' +
            '<button onclick="window.location.reload()" style="background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600;">Spróbuj ponownie</button>';
        }
      }, 12000);

      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="background: #0f172a; color: #f87171; padding: 30px; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center;">' +
            '<h2 style="margin-bottom: 10px;">Błąd ładowania aplikacji</h2>' +
            '<p style="color: #94a3b8; font-size: 14px;">Wystąpił problem techniczny podczas uruchamiania na tym urządzeniu.</p>' +
            '<div style="background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 20px; font-family: monospace; font-size: 12px; text-align: left; overflow: auto; max-height: 200px;">' +
            '<strong>Error:</strong> ' + msg + '<br>' +
            '<strong>URL:</strong> ' + url + '<br>' +
            '<strong>Line:</strong> ' + lineNo + ':' + columnNo +
            '</div>' +
            '<button onclick="window.location.reload()" style="margin-top: 25px; background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600;">Odśwież</button>' +
            '</div>';
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
